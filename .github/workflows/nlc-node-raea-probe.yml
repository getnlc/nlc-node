name: NLC Node raea probe
on:
  push:
    branches: [raea-proof]
    paths: [.github/workflows/nlc-node-raea-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  RAEA_TAG: v0.1.1-rc2
  RAEA_OFFLINE: "1"
  RAEA_FEED_MCP_PORT: "0"
jobs:
  win:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $v='0.1.1-rc2'; $f="raea-$v-windows-x86_64.zip"
          Invoke-WebRequest "https://github.com/shinyobjectz/raea/releases/download/$env:RAEA_TAG/$f" -OutFile $f
          New-Item -ItemType Directory x | Out-Null; tar -xf $f -C x
          $r = (Resolve-Path x\raea).Path
          choco install vulkan-sdk -y --no-progress 2>&1 | Select -Last 3
          $ldr = (Get-ChildItem C:VulkanSDK -Recurse -Filter vulkan-1.dll | Where-Object { $_.FullName -match "Bin" } | Select -First 1).FullName; $ldr
          $env:PATH = (Split-Path $ldr) + ";" + $env:PATH
          Invoke-WebRequest https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-msvc.7z -OutFile mesa.7z
          (Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLower()
          7z x mesa.7z -omesa -y | Select -Last 3
          Get-ChildItem mesa -Recurse | Where-Object { $_.Name -match 'lvp|vulkan' } | Select -ExpandProperty FullName
          $icd = (Get-ChildItem mesa -Recurse -Filter 'lvp_icd*.json' | Select -First 1).FullName
          $icd; Get-Content $icd
          $env:VK_DRIVER_FILES = $icd; $env:VK_ICD_FILENAMES = $icd
          $env:WGPU_BACKEND = 'vulkan'
          & "$r\bin\raea.exe" render tests/nlc-node/fixtures/scene-sample/hello.tsx -o out.mp4 --quality draft 2>&1 | Select -Last 30
          "exit $LASTEXITCODE"
          if (Test-Path out.mp4) { (Get-Item out.mp4).Length }
  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          v=0.1.1-rc2; f="raea-$v-macos-arm64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/shinyobjectz/raea/releases/download/$RAEA_TAG/$f"
          shasum -a 256 "$f"
          mkdir x && tar -xzf "$f" -C x && ls x x/*
          r=$(ls -d x/*/ | head -1); r=$(cd "$r" && pwd)
          "$r/bin/raea" --version
          system_profiler SPDisplaysDataType | head -20
          "$r/bin/raea" render tests/nlc-node/fixtures/scene-sample/hello.tsx -o out.mp4 --quality draft 2>&1 | tail -30
          echo "exit $?"; ls -l out.mp4
