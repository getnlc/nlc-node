name: NLC Node self-update proof (unsigned)

# Proves on clean GitHub-hosted runners that an installed NLC Node moves to a newly published build by itself, with no window
# (not even a console flash) on Windows. Installs the built payload with the customer's own one-line installer against the real
# server side, publishes a newer build, and waits. No secrets are used. The ffmpeg and whisper tools are not part of this
# proof (they change nothing about how a Node updates), so the payload is built without them.
on:
  workflow_dispatch:
  push:
    branches: [nlc-node-selfupdate]

permissions:
  contents: read

jobs:
  selfupdate-macos:
    name: Self-update on a clean macOS runner
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix ui
          npm ci --ignore-scripts --no-audit --no-fund --prefix mcp
          mkdir -p mcp-gateway
          ln -s "${GITHUB_WORKSPACE}/mcp/node_modules" mcp-gateway/node_modules
      - name: Unit tests for the updater, the server notice, the supervision plan and the installers
        run: |
          node --test tests/nlc-node/self-update.test.cjs tests/nlc-node/supervision.test.cjs
          (cd ui && node --test tests/node-update-notice.test.mjs tests/node-install-routes.test.mjs)
      - name: Build the app and pack the payload
        env:
          NLC_NODE_UPDATE_PUBLIC_KEY_B64: ${{ vars.NLC_NODE_UPDATE_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          ./installer/nlc-node/macos/build.sh macos-arm64
          node scripts/nlc-node/build-payload.cjs macos-arm64 --out "${RUNNER_TEMP}/payload"
          ls -l "${RUNNER_TEMP}/payload"
      - name: Prove an installed Node moves to a newly published build by itself
        run: node tests/nlc-node/e2e/selfupdate-proof.cjs --artifacts "${RUNNER_TEMP}/payload" --transcript "${RUNNER_TEMP}/selfupdate-macos.txt"
      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NLC-Node-selfupdate-macos-transcript
          path: ${{ runner.temp }}/selfupdate-macos.txt
          if-no-files-found: warn
          retention-days: 7

  selfupdate-windows:
    name: Self-update on a clean Windows runner
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Install NSIS (the build script makes the setup program too)
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) { throw "NSIS did not provide makensis.exe." }
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix ui
          npm ci --ignore-scripts --no-audit --no-fund --prefix mcp
          New-Item -ItemType Directory -Force -Path mcp-gateway | Out-Null
          New-Item -ItemType Junction -Path mcp-gateway\node_modules -Target "$env:GITHUB_WORKSPACE\mcp\node_modules" | Out-Null
      - name: Unit tests for the updater, the server notice, the supervision plan and the installers
        shell: pwsh
        run: |
          node --test tests/nlc-node/self-update.test.cjs tests/nlc-node/supervision.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'self-update tests failed' }
          Push-Location ui; node --test tests/node-update-notice.test.mjs tests/node-install-routes.test.mjs; $code = $LASTEXITCODE; Pop-Location
          if ($code -ne 0) { throw 'update notice or install route tests failed' }
      - name: Build the launcher and host, and pack the payload
        env:
          NLC_NODE_UPDATE_PUBLIC_KEY_B64: ${{ vars.NLC_NODE_UPDATE_PUBLIC_KEY_B64 }}
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) { throw "Visual C++ build tools are unavailable." }
          $developerCommand = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          cmd.exe /c "`"$developerCommand`" -arch=x64 && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process") }
          }
          .\installer\nlc-node\windows\build.ps1 -OutputRoot "$env:GITHUB_WORKSPACE\dist\nlc-node\windows-x64"
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          node scripts/nlc-node/build-payload.cjs windows-x64 --out "$env:RUNNER_TEMP\payload"
          if ($LASTEXITCODE -ne 0) { throw 'payload build failed' }
          Get-ChildItem "$env:RUNNER_TEMP\payload" | Format-Table Name, Length
      - name: Prove an installed Node moves to a newly published build by itself, with no window on screen
        shell: pwsh
        run: node tests/nlc-node/e2e/selfupdate-proof.cjs --artifacts "$env:RUNNER_TEMP\payload" --transcript "$env:RUNNER_TEMP\selfupdate-windows.txt"
      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NLC-Node-selfupdate-windows-transcript
          path: ${{ runner.temp }}/selfupdate-windows.txt
          if-no-files-found: warn
          retention-days: 7
